<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进入 · 灵感一现</title>
<style>
:root{--ink:#2f4636;--muted:#6d7f6f;--line:#dfe5d8;--paper:#f6f7f1;--green:#3f604a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 0%,#eef2e6,#f6f7f1 60%);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:0 18px 60px rgba(47,70,54,.10)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark{color:#6f8f6a;font-size:26px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:.02em}
p.sub{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--paper)}
input:focus{outline:2px solid #b9c9b2;outline-offset:1px}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.msg{margin-top:14px;font-size:14px;color:#a34a3a;min-height:20px}
.foot{margin-top:20px;font-size:12px;color:var(--muted)}
a{color:var(--green)}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="mark">✳</span><strong>灵感一现</strong></div>
  <h1>进入我的认知空间</h1>
  <p class="sub">自托管站点使用独立口令登录，不再依赖第三方账号。</p>
  <form id="login-form">
    <label for="code">访问口令</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required autofocus maxlength="200">
    <button type="submit">进入</button>
  </form>
  <p class="msg" id="msg" role="alert"></p>
  <p class="foot">未登录也可以浏览公开示例；个人资料只对持有口令的人可见。<a href="/">先看看示例</a></p>
</main>
<script src="/login/login.js"></script>
</body>
</html>
